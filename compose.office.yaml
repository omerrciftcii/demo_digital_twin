services:
  digital-twin:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: "no"
    environment:
      DEMO_CCO_DIR: /app/data/cco
      DEMO_ALLOWED_HOSTS: ${DEMO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DEMO_ALLOWED_NETWORKS: ${DEMO_ALLOWED_NETWORKS:-127.0.0.0/8}
      DEMO_VLLM_BASE_URL: ${DEMO_VLLM_BASE_URL:-http://host.docker.internal:18000}
      DEMO_GEMMA_MODEL: ${DEMO_GEMMA_MODEL:-gemma4-26b-a4b}
      DEMO_QWEN_BASE_URL: ${DEMO_QWEN_BASE_URL:-}
      DEMO_QWEN_MODEL: ${DEMO_QWEN_MODEL:-Qwen/Qwen3.5-9B}
      DEMO_KIMI_BASE_URL: ${DEMO_KIMI_BASE_URL:-}
      DEMO_KIMI_MODEL: ${DEMO_KIMI_MODEL:-moonshotai/Moonlight-16B-A3B-Instruct}
      DEMO_DEEPSEEK_BASE_URL: ${DEMO_DEEPSEEK_BASE_URL:-}
      DEMO_DEEPSEEK_MODEL: ${DEMO_DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-14B}
      DEMO_NEMOTRON_BASE_URL: ${DEMO_NEMOTRON_BASE_URL:-}
      DEMO_NEMOTRON_MODEL: ${DEMO_NEMOTRON_MODEL:-nvidia/NVIDIA-Nemotron-Nano-9B-v2}
      DEMO_ALLOW_EXTERNAL_MODELS: ${DEMO_ALLOW_EXTERNAL_MODELS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEMO_OPENAI_MODEL: ${DEMO_OPENAI_MODEL:-gpt-6-luna}
    ports:
      - "${DEMO_BIND_IP:-127.0.0.1}:${DEMO_PORT:-8092}:8092"
    volumes:
      - ./data/cco:/app/data/cco:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
